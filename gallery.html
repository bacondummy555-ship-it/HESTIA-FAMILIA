<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Approved memories, screenshots, artwork, and videos shared by Hestia Familia members."
    >

    <title>Gallery | HESTIA FAMILIA</title>

    <link
        rel="icon"
        type="image/png"
        href="webicon.png"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css?v=82"
    >

    <link
        rel="stylesheet"
        href="gallery.css?v=90"
    >

</head>

<body class="gallery-page">

    <!-- ================================================
         LOADING SCREEN
    ================================================= -->

    <div id="loading-screen">

        <img
            src="HESTIACLANLOGOREAL.png"
            alt="Hestia Familia Logo"
        >

        <h1>HESTIA FAMILIA</h1>

        <p>Familia Gallery</p>

    </div>

    <!-- ================================================
         BACKGROUND EFFECTS
    ================================================= -->

    <div
        class="background-effects"
        aria-hidden="true"
    >

        <div class="stars"></div>

        <div id="twinkling-stars"></div>

        <div id="embers"></div>

        <div id="shooting-stars"></div>

    </div>

    <!-- ================================================
         HEADER
    ================================================= -->

    <header>

        <a
            class="brand"
            href="index.html"
            aria-label="Go to Hestia Familia homepage"
        >

            <img
                src="HESTIACLANLOGOREAL.png"
                alt="HESTIA Familia logo"
            >

            <span>
                HESTIA FAMILIA
            </span>

        </a>

        <nav aria-label="Main navigation">

            <a href="index.html">
                Home
            </a>

            <a href="members.html">
                Members
            </a>

            <a
                class="active"
                href="gallery.html"
                aria-current="page"
            >
                Gallery
            </a>

            <a href="rules.html">
                Rules
            </a>

            <a
                href="https://discord.gg/Nd5yAmPu9a"
                target="_blank"
                rel="noopener noreferrer"
            >
                Discord
            </a>

        </nav>

    </header>

    <!-- ================================================
         MAIN CONTENT
    ================================================= -->

    <main class="gallery-main">

        <!-- Gallery introduction -->

        <section class="gallery-heading">

            <span
                class="heading-symbol"
                aria-hidden="true"
            >
                ✦
            </span>

            <h1>
                Familia Gallery
            </h1>

            <p>
                Memories, battles, creations, and moments shared
                beneath the banner of Hestia Familia.
            </p>

        </section>

        <!-- Dynamic Discord gallery -->

        <section class="gallery-section">

            <div class="gallery-title">

                <span aria-hidden="true">
                    ✦
                </span>

                <h2>
                    Our Memories
                </h2>

                <span aria-hidden="true">
                    ✦
                </span>

            </div>

            <p
                id="gallery-status"
                class="gallery-status gallery-count"
                aria-live="polite"
            >
                Gathering approved Familia memories...
            </p>

            <!--
                Approved images and videos from Discord
                will be generated here automatically
                by gallery.js.
            -->

            <div
                id="gallery-grid"
                class="gallery-grid"
                aria-live="polite"
                aria-busy="true"
            ></div>

        </section>

        <p class="gallery-developer">
            Developed by salt
        </p>

    </main>

    <!-- ================================================
         IMAGE / VIDEO LIGHTBOX
    ================================================= -->

    <div
        id="gallery-lightbox"
        class="gallery-lightbox"
        aria-hidden="true"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lightbox-title"
    >

        <button
            id="lightbox-close"
            class="lightbox-close"
            type="button"
            aria-label="Close gallery preview"
        >
            ×
        </button>

        <button
            id="lightbox-previous"
            class="lightbox-navigation lightbox-previous"
            type="button"
            aria-label="Previous gallery item"
        >
            ‹
        </button>

        <figure class="lightbox-content">

            <div
                id="lightbox-media-container"
                class="lightbox-media-container"
            >

                <img
                    id="lightbox-image"
                    src=""
                    alt=""
                    hidden
                >

                <video
                    id="lightbox-video"
                    controls
                    playsinline
                    preload="metadata"
                    hidden
                ></video>

            </div>

            <figcaption>

                <h2 id="lightbox-title"></h2>

                <p id="lightbox-description"></p>

                <span
                    id="lightbox-uploader"
                    class="lightbox-uploader"
                ></span>

            </figcaption>

        </figure>

        <button
            id="lightbox-next"
            class="lightbox-navigation lightbox-next"
            type="button"
            aria-label="Next gallery item"
        >
            ›
        </button>

    </div>

    <!-- ================================================
         SCRIPTS
    ================================================= -->

    <script src="script.js?v=82"></script>

    <script src="gallery.js?v=95"></script>

</body>

</html>
