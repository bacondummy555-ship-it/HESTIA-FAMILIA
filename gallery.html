<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gallery | HESTIA FAMILIA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css?v=80">
    <link rel="stylesheet" href="gallery.css?v=80">

</head>

<body class="gallery-page">

    <div id="loading-screen">

        <img
            src="HESTIACLANLOGOREAL.png"
            alt="Hestia Familia Logo"
        >

        <h1>HESTIA FAMILIA</h1>

        <p>Familia Gallery</p>

    </div>

    <div class="background-effects">

        <div class="stars"></div>

        <div id="twinkling-stars"></div>

        <div id="embers"></div>

        <div id="shooting-stars"></div>

    </div>

    <header>

        <a class="brand" href="index.html">

            <img
                src="HESTIACLANLOGOREAL.png"
                alt="HESTIA Logo"
            >

            <span>HESTIA FAMILIA</span>

        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="members.html">
                Members
            </a>

            <a
                class="active"
                href="gallery.html"
            >
                Gallery
            </a>

            <a href="rules.html">
                Rules
            </a>

            <a
                href="https://discord.gg/Nd5yAmPu9a"
                target="_blank"
                rel="noopener noreferrer"
            >
                Discord
            </a>

        </nav>

    </header>

    <main class="gallery-main">

        <section class="gallery-heading">

            <span class="heading-symbol">
                ✦
            </span>

            <h1>Familia Gallery</h1>

            <p>
                Memories, battles, creations, and moments shared
                beneath the banner of Hestia Familia.
            </p>

        </section>

        <section class="gallery-section">

            <div class="gallery-title">

                <span>✦</span>

                <h2>Our Memories</h2>

                <span>✦</span>

            </div>

            <p class="gallery-count">
                Click an image to view it in fullscreen.
            </p>

            <div
                id="gallery-grid"
                class="gallery-grid"
            >

                <button
                    class="gallery-item"
                    type="button"
                    data-full="meandaki2.png"
                    data-title="Random Snaps"
                    data-description="A memorable memory of Hestia Familia."
                >

                    <img
                        src="meandaki2.png"
                        alt="Random Snaps"
                        loading="lazy"
                    >

                    <span class="gallery-overlay">

                        <strong>Random Snaps</strong>

                        <small>
                            View image
                        </small>

                    </span>

                </button>

                <button
                    class="gallery-item"
                    type="button"
                    data-full="gallery2.jpg"
                    data-title="Battle Memories"
                    data-description="Moments forged through battle and teamwork."
                >

                    <img
                        src="gallery2.jpg"
                        alt="Battle Memories"
                        loading="lazy"
                    >

                    <span class="gallery-overlay">

                        <strong>Battle Memories</strong>

                        <small>
                            View image
                        </small>

                    </span>

                </button>

                <button
                    class="gallery-item"
                    type="button"
                    data-full="gallery3.jpg"
                    data-title="Familia Adventure"
                    data-description="Another adventure shared beneath our banner."
                >

                    <img
                        src="gallery3.jpg"
                        alt="Familia Adventure"
                        loading="lazy"
                    >

                    <span class="gallery-overlay">

                        <strong>Familia Adventure</strong>

                        <small>
                            View image
                        </small>

                    </span>

                </button>

                <button
                    class="gallery-item"
                    type="button"
                    data-full="gallery4.jpg"
                    data-title="Guild Moment"
                    data-description="A special moment remembered by the Familia."
                >

                    <img
                        src="gallery4.jpg"
                        alt="Guild Moment"
                        loading="lazy"
                    >

                    <span class="gallery-overlay">

                        <strong>Guild Moment</strong>

                        <small>
                            View image
                        </small>

                    </span>

                </button>

                <button
                    class="gallery-item"
                    type="button"
                    data-full="gallery5.jpg"
                    data-title="Hestia Creation"
                    data-description="A creation made by a member of Hestia Familia."
                >

                    <img
                        src="gallery5.jpg"
                        alt="Hestia Creation"
                        loading="lazy"
                    >

                    <span class="gallery-overlay">

                        <strong>Hestia Creation</strong>

                        <small>
                            View image
                        </small>

                    </span>

                </button>

                <button
                    class="gallery-item"
                    type="button"
                    data-full="gallery6.jpg"
                    data-title="Under the Banner"
                    data-description="United under one banner as one Familia."
                >

                    <img
                        src="gallery6.jpg"
                        alt="Under the Banner"
                        loading="lazy"
                    >

                    <span class="gallery-overlay">

                        <strong>Under the Banner</strong>

                        <small>
                            View image
                        </small>

                    </span>

                </button>

            </div>

        </section>

        <p class="gallery-developer">
            Developed by salt
        </p>

    </main>

    <div
        id="gallery-lightbox"
        class="gallery-lightbox"
        aria-hidden="true"
    >

        <button
            id="lightbox-close"
            class="lightbox-close"
            type="button"
            aria-label="Close image"
        >
            ×
        </button>

        <button
            id="lightbox-previous"
            class="lightbox-navigation lightbox-previous"
            type="button"
            aria-label="Previous image"
        >
            ‹
        </button>

        <figure class="lightbox-content">

            <img
                id="lightbox-image"
                src=""
                alt=""
            >

            <figcaption>

                <h2 id="lightbox-title"></h2>

                <p id="lightbox-description"></p>

            </figcaption>

        </figure>

        <button
            id="lightbox-next"
            class="lightbox-navigation lightbox-next"
            type="button"
            aria-label="Next image"
        >
            ›
        </button>

    </div>

    <script src="script.js?v=80"></script>
    <script src="gallery.js?v=80"></script>

</body>

</html>
