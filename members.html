<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Members | HESTIA FAMILIA</title>

    <!-- Favicon -->
    <link rel="icon" href="webicon.png" sizes="any">
    <link rel="icon" type="image/png" href="webicon.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet"
    >

    <!-- Styles -->
    <link rel="stylesheet" href="style.css?v=110">
    <link rel="stylesheet" href="members.css?v=130">

</head>

<body class="members-page">

    <!-- Loading screen -->

    <div id="loading-screen">

        <img
            src="HESTIACLANLOGOREAL.png"
            alt="Hestia Familia Logo"
        >

        <h1>HESTIA FAMILIA</h1>

        <p>Meet the Familia</p>

    </div>

    <!-- Animated background -->

    <div class="background-effects">

        <div class="stars"></div>

        <div id="twinkling-stars"></div>

        <div id="embers"></div>

        <div id="shooting-stars"></div>

    </div>

    <!-- Navigation -->

    <header>

        <a class="brand" href="index.html">

            <img
                src="HESTIACLANLOGOREAL.png"
                alt="HESTIA Logo"
            >

            <span>HESTIA FAMILIA</span>

        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a
                class="active"
                href="members.html"
            >
                Members
            </a>

            <a href="gallery.html">
                Gallery
            </a>

            <a href="rules.html">
                Rules
            </a>

            <a
                href="https://discord.gg/Nd5yAmPu9a"
                target="_blank"
                rel="noopener noreferrer"
            >
                Discord
            </a>

        </nav>

    </header>

    <!-- Main content -->

    <main class="members-main">

        <!-- Page heading -->

        <section class="members-heading">

            <span class="heading-symbol">
                ✦
            </span>

            <h1>Meet the Familia</h1>

            <p>
                United under one banner, each member carries the
                strength, loyalty, and honor of Hestia Familia.
            </p>

        </section>

        <!-- Automatic Discord members -->

        <section class="members-section">

            <div class="section-title">

                <span>✦</span>

                <h2>Familia Members</h2>

                <span>✦</span>

            </div>

            <p
                id="members-status"
                class="members-status"
                aria-live="polite"
            >
                Gathering the Familia...
            </p>

            <!-- Member search -->

            <div class="member-search-wrapper">

                <span class="member-search-icon">
                    ⌕
                </span>

                <input
                    id="member-search"
                    class="member-search"
                    type="search"
                    placeholder="Search a member..."
                    autocomplete="off"
                    aria-label="Search members by Discord name"
                >

                <button
                    id="member-search-clear"
                    class="member-search-clear"
                    type="button"
                    aria-label="Clear member search"
                    hidden
                >
                    ×
                </button>

            </div>

            <p
                id="member-search-result"
                class="member-search-result"
                aria-live="polite"
            ></p>

            <div
    id="member-role-filters"
    class="member-role-filters"
    aria-label="Filter members by role"
>
    <button
        class="member-role-filter active"
        type="button"
        data-role="all"
    >
        All
    </button>
</div>

            <!-- Discord role groups and member cards appear here -->

            <div
                id="member-grid"
                class="role-groups-container"
            ></div>

        </section>

        <p class="members-developer">
            Developed by salt
        </p>

    </main>

    <!-- Scripts -->

    <script src="script.js?v=110"></script>
    <script src="members.js?v=150"></script>

</body>

</html>
