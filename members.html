<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"

    <title>Members | HESTIA FAMILIA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"

    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap"

    <link rel="stylesheet" href="style.css?v=10">

<body class="members-page">

    <!-- Loading screen -->

    <div id="loading-screen">

        <img
            src="HESTIACLANLOGOREAL.png"
            alt="Hestia Familia Logo"
        >

        <h1>HESTIA FAMILIA</h1>

        <p>Meet the Familia</p>

    </div>

    <!-- Animated background -->

    <div class="background-effects">

        <div class="stars"></div>

        <div id="twinkling-stars"></div>

        <div id="embers"></div>

        <div id="shooting-stars"></div>

    </div>

    <!-- Navigation -->

    <header>

        <a class="brand" href="index.html">

            <img
                src="HESTIACLANLOGOREAL.png"
                alt="HESTIA Logo"
            >

            <span>HESTIA FAMILIA</span>

        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a
                class="active"
                href="members.html"

            <a href="gallery.html">

            <a href="rules.html">

            <a

            </a>

        </nav>

    </header>

    <!-- Main content -->

    <main class="members-main">

        <section class="members-heading">

            <span class="heading-symbol">
                ✦
            </span>

            <h1>Meet the Familia</h1>

            <p>

        </section>

        <!-- Automatic Discord members -->

        <section class="members-section">

            <div class="section-title">

                <span>✦</span>

                <h2>Familia Members</h2>

                <span>✦</span>

            </div>

            <p
                id="members-status"
                class="members-status"
                aria-live="polite"
            >
                Gathering the Familia...
            </p>

            <div
                id="member-grid"
                class="member-grid"
            ></div>

        </section>

        <p class="members-developer">
            Developed by salt
        </p>

    </main>

    <script src="script.js?v=10"></script>
    <script src="members.js?v=10"></script>
